<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ระบบเยี่ยมบ้าน</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { background-color: #f0f2f5; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        .card { border: none; border-radius: 12px; box-shadow: 0 4px 6px rgba(0,0,0,0.05); }
        .nav-pills .nav-link { border-radius: 0; color: #6c757d; font-weight: 500; padding: 12px; }
        .nav-pills .nav-link.active { background-color: transparent; color: #0d6efd; border-bottom: 3px solid #0d6efd; }
        .form-control { border-radius: 8px; }
        .btn { border-radius: 8px; font-weight: 500; }
        #map { height: 60vh; width: 100%; border-radius: 12px; }
        .hidden { display: none !important; }
        #app-container { display: none; }
    </style>
</head>
<body>

    <div id="login-container" class="container mt-5 pt-5">
        <div class="row justify-content-center">
            <div class="col-md-4 col-sm-8">
                <div class="card p-4">
                    <div class="card-body">
                        <h4 class="text-center mb-4"><i class="bi bi-house-heart-fill text-primary"></i> เยี่ยมบ้าน</h4>
                        <input type="text" id="username" class="form-control mb-3 p-3" placeholder="ชื่อผู้ใช้งาน">
                        <input type="password" id="password" class="form-control mb-4 p-3" placeholder="รหัสผ่าน">
                        <button class="btn btn-primary w-100 p-2" onclick="login()">เข้าสู่ระบบ</button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <div id="app-container" class="container-fluid p-0">
        <ul class="nav nav-pills nav-fill bg-white shadow-sm mb-3" id="myTab" role="tablist">
            <li class="nav-item" role="presentation">
                <button class="nav-link active" id="patient-tab" data-bs-toggle="tab" data-bs-target="#patient"><i class="bi bi-person-plus"></i> ผู้ป่วย</button>
            </li>
            <li class="nav-item" role="presentation">
                <button class="nav-link" id="visit-tab" data-bs-toggle="tab" data-bs-target="#visit"><i class="bi bi-journal-medical"></i> บันทึก</button>
            </li>
            <li class="nav-item" role="presentation">
                <button class="nav-link" id="map-tab" data-bs-toggle="tab" data-bs-target="#mapView" onclick="initMap()"><i class="bi bi-geo-alt"></i> แผนที่</button>
            </li>
            <li class="nav-item hidden" id="admin-nav" role="presentation">
                <button class="nav-link text-danger" id="admin-tab" data-bs-toggle="tab" data-bs-target="#admin" onclick="loadUsers()"><i class="bi bi-shield-lock"></i> จัดการผู้ใช้</button>
            </li>
        </ul>

        <div class="tab-content p-3 container-md" id="myTabContent">
            
            <div class="tab-pane fade show active" id="patient">
                <div class="card">
                    <div class="card-body">
                        <h5 class="mb-3 text-primary"><i class="bi bi-person-lines-fill"></i> ลงทะเบียนผู้ป่วยใหม่</h5>
                        
                        <div class="form-floating mb-3">
                            <input type="text" id="pHN" class="form-control" placeholder="HN" maxlength="7">
                            <label>HN (สูงสุด 7 หลัก)</label>
                        </div>
                        <div class="form-floating mb-3">
                            <input type="text" id="pName" class="form-control" placeholder="ชื่อ-สกุล">
                            <label>ชื่อ-นามสกุล</label>
                        </div>
                        <div class="form-floating mb-3">
                            <input type="text" id="pCID" class="form-control" placeholder="เลขบัตรประชาชน" maxlength="13">
                            <label>เลขบัตรประชาชน (13 หลัก)</label>
                        </div>
                        <div class="form-floating mb-3">
                            <textarea id="pAddress" class="form-control" placeholder="ที่อยู่" style="height: 80px"></textarea>
                            <label>ที่อยู่</label>
                        </div>
                        <div class="form-floating mb-3">
                            <input type="text" id="pPhone" class="form-control" placeholder="เบอร์โทรศัพท์" maxlength="10">
                            <label>เบอร์โทรศัพท์ (บ้าน 9, มือถือ 10 หลัก)</label>
                        </div>
                        <div class="form-floating mb-3">
                            <input type="text" id="pDisease" class="form-control" placeholder="โรคประจำตัว">
                            <label>โรคประจำตัว</label>
                        </div>
                        
                        <div class="input-group mb-4">
                            <input type="text" id="pLat" class="form-control" placeholder="ละติจูด (Lat)" readonly>
                            <input type="text" id="pLng" class="form-control" placeholder="ลองจิจูด (Lng)" readonly>
                            <button class="btn btn-outline-danger" type="button" onclick="getLocation('pLat','pLng')"><i class="bi bi-crosshair"></i> ดึงพิกัด</button>
                        </div>
                        
                        <button class="btn btn-success w-100 p-2" onclick="savePatient()"><i class="bi bi-save"></i> บันทึกผู้ป่วยใหม่</button>
                    </div>
                </div>
            </div>

            <div class="tab-pane fade" id="visit">
                <div class="card">
                    <div class="card-body">
                        <h5 class="mb-3 text-success"><i class="bi bi-house-check"></i> บันทึกการเยี่ยมบ้าน</h5>
                        <div class="form-floating mb-3">
                            <input type="text" id="vHN" class="form-control" placeholder="HN ผู้ป่วย" maxlength="7">
                            <label>HN ผู้ป่วย</label>
                        </div>
                        <div class="form-floating mb-3">
                            <input type="date" id="vDate" class="form-control">
                            <label>วันที่เยี่ยม</label>
                        </div>
                        <div class="form-floating mb-3">
                            <textarea id="vDetails" class="form-control" style="height: 100px" placeholder="รายละเอียด"></textarea>
                            <label>รายละเอียด / อาการ</label>
                        </div>
                        
                        <div class="mb-3">
                            <label class="form-label text-muted small"><i class="bi bi-camera"></i> อัปโหลดรูป (สูงสุด 6 รูป)</label>
                            <input type="file" id="vPhotos" class="form-control" accept="image/*" multiple>
                        </div>
                        
                        <div class="input-group mb-4">
                            <input type="text" id="vLat" class="form-control" placeholder="Lat" readonly>
                            <input type="text" id="vLng" class="form-control" placeholder="Lng" readonly>
                            <button class="btn btn-outline-danger" type="button" onclick="getLocation('vLat','vLng')"><i class="bi bi-crosshair"></i> ดึงพิกัด</button>
                        </div>

                        <button class="btn btn-primary w-100 p-2" onclick="saveVisit()" id="btnSaveVisit"><i class="bi bi-cloud-arrow-up"></i> บันทึกข้อมูลและอัปโหลดรูป</button>
                    </div>
                </div>
            </div>

            <div class="tab-pane fade" id="mapView">
                <div id="map" class="shadow-sm"></div>
                <button class="btn btn-outline-primary w-100 mt-3" onclick="loadMapData()"><i class="bi bi-arrow-clockwise"></i> โหลดหมุดใหม่</button>
            </div>

            <div class="tab-pane fade" id="admin">
                <div class="card mb-3">
                    <div class="card-body bg-light">
                        <h6><i class="bi bi-person-plus-fill"></i> เพิ่มผู้ใช้งาน</h6>
                        <div class="row g-2">
                            <div class="col-6"><input type="text" id="aUser" class="form-control" placeholder="Username"></div>
                            <div class="col-6"><input type="text" id="aPass" class="form-control" placeholder="Password"></div>
                            <div class="col-6"><input type="text" id="aName" class="form-control" placeholder="ชื่อ-สกุล"></div>
                            <div class="col-6">
                                <select id="aRole" class="form-select">
                                    <option value="User">User</option>
                                    <option value="Admin">Admin</option>
                                </select>
                            </div>
                            <div class="col-12"><button class="btn btn-danger w-100" onclick="addUser()">เพิ่มผู้ใช้</button></div>
                        </div>
                    </div>
                </div>
                <div class="card">
                    <div class="card-body p-0">
                        <ul class="list-group list-group-flush" id="userList">
                            </ul>
                    </div>
                </div>
            </div>

        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    
    <script>
        // ใช้ URL จากชีต4.csv ของคุณ
        const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbxHC-q-R7zvc1GgRd4VH6sKMNEV3hsr79JJ2Y2i26OjHBCp_nzosD_jWpZu5C16vhBi1w/exec';
        let currentUserEmail = "";
        let patientsList = [];
        let map;

        async function callAPI(payload) {
            const res = await fetch(SCRIPT_URL, { method: 'POST', body: JSON.stringify(payload) });
            return await res.json();
        }

        async function login() {
            const u = document.getElementById('username').value;
            const p = document.getElementById('password').value;
            if(!u || !p) return alert("กรุณากรอกข้อมูล");
            
            let res = await callAPI({ action: "login", username: u, password: p });
            if(res.status === "success") {
                currentUserEmail = res.email;
                document.getElementById('login-container').classList.add('hidden');
                document.getElementById('app-container').style.display = 'block';
                
                // ตรวจสอบสิทธิ์ Admin เปิดแท็บพิเศษ
                if(res.role === "Admin") {
                    document.getElementById('admin-nav').classList.remove('hidden');
                }
                fetchPatients();
            } else {
                alert(res.message);
            }
        }

        // การล้างฟอร์ม
        function clearForm(formType) {
            if(formType === 'patient') {
                document.getElementById('pHN').value = '';
                document.getElementById('pName').value = '';
                document.getElementById('pCID').value = '';
                document.getElementById('pAddress').value = '';
                document.getElementById('pPhone').value = '';
                document.getElementById('pDisease').value = '';
                document.getElementById('pLat').value = '';
                document.getElementById('pLng').value = '';
            } else if(formType === 'visit') {
                document.getElementById('vHN').value = '';
                document.getElementById('vDetails').value = '';
                document.getElementById('vPhotos').value = '';
                document.getElementById('vLat').value = '';
                document.getElementById('vLng').value = '';
                // ไม่ล้างวันที่ เพื่อความสะดวกในการลงข้อมูลต่อเนื่อง
            }
        }

        // การเช็คความถูกต้อง (Validation)
        function validateInputs(type) {
            if(type === 'patient') {
                const hn = document.getElementById('pHN').value;
                const cid = document.getElementById('pCID').value;
                const phone = document.getElementById('pPhone').value;
                
                if(!hn || hn.length > 7) return "HN ต้องไม่เกิน 7 หลัก";
                if(cid && !/^\d{13}$/.test(cid)) return "เลขบัตรประชาชนต้องมี 13 หลัก";
                if(phone && !/^\d{9,10}$/.test(phone)) return "เบอร์โทรศัพท์ต้องมี 9 หรือ 10 หลัก";
                return "ok";
            }
            return "ok";
        }

        // แปลงปี พ.ศ. เป็น ค.ศ.
        function formatToCE(dateStr) {
            if (!dateStr) return "";
            let parts = dateStr.split("-");
            let year = parseInt(parts[0]);
            if (year > 2500) year -= 543;
            return `${year}-${parts[1]}-${parts[2]}`;
        }

        // ย่อรูป Canvas
        function compressImage(file, maxSize = 800) {
            return new Promise((resolve) => {
                const reader = new FileReader();
                reader.readAsDataURL(file);
                reader.onload = event => {
                    const img = new Image();
                    img.src = event.target.result;
                    img.onload = () => {
                        const canvas = document.createElement('canvas');
                        let w = img.width, h = img.height;
                        if (w > h) { if (w > maxSize) { h *= maxSize / w; w = maxSize; } } 
                        else { if (h > maxSize) { w *= maxSize / h; h = maxSize; } }
                        canvas.width = w; canvas.height = h;
                        const ctx = canvas.getContext('2d');
                        ctx.drawImage(img, 0, 0, w, h);
                        resolve(canvas.toDataURL('image/jpeg', 0.6)); 
                    };
                };
            });
        }

        async function savePatient() {
            let valResult = validateInputs('patient');
            if(valResult !== "ok") return alert(valResult);

            const p = {
                HN: document.getElementById('pHN').value,
                Name: document.getElementById('pName').value,
                CID: document.getElementById('pCID').value,
                Address: document.getElementById('pAddress').value,
                Phone: document.getElementById('pPhone').value,
                Chronic_Disease: document.getElementById('pDisease').value,
                Latitude: document.getElementById('pLat').value,
                Longitude: document.getElementById('pLng').value
            };
            
            let res = await callAPI({ action: "savePatient", patient: p });
            if(res.status === "success") {
                alert("บันทึกผู้ป่วยใหม่สำเร็จ");
                clearForm('patient');
                fetchPatients(); 
            }
        }

        async function saveVisit() {
            const hn = document.getElementById('vHN').value;
            const dateInput = document.getElementById('vDate').value;
            const fileInput = document.getElementById('vPhotos');

            if(!hn || !dateInput) return alert("กรุณาระบุ HN และ วันที่");
            if(fileInput.files.length > 6) return alert("อัปโหลดได้สูงสุด 6 รูป");

            let btn = document.getElementById('btnSaveVisit');
            btn.innerHTML = `<span class="spinner-border spinner-border-sm"></span> กำลังบันทึก...`;
            btn.disabled = true;

            const finalDate = formatToCE(dateInput); 
            const visitId = "V" + new Date().getTime().toString().slice(-6); 
            
            let base64Photos = [];
            for (let i = 0; i < fileInput.files.length; i++) {
                base64Photos.push(await compressImage(fileInput.files[i]));
            }

            const payload = {
                action: "saveVisit",
                visit: {
                    Visit_ID: visitId, HN: hn, Visit_Date: finalDate, 
                    Staff_Email: currentUserEmail, 
                    Details: document.getElementById('vDetails').value, 
                    Lat_Logged: document.getElementById('vLat').value, 
                    Lng_Logged: document.getElementById('vLng').value, 
                    photos: base64Photos
                }
            };

            let res = await callAPI(payload);
            if(res.status === "success") {
                alert("บันทึกข้อมูลเยี่ยมบ้านสำเร็จ!");
                clearForm('visit');
            } else {
                alert("เกิดข้อผิดพลาด");
            }
            btn.innerHTML = `<i class="bi bi-cloud-arrow-up"></i> บันทึกข้อมูลและอัปโหลดรูป`;
            btn.disabled = false;
        }

        // Admin Functions
        async function loadUsers() {
            let res = await callAPI({ action: "getUsers" });
            if(res.status === "success") {
                const list = document.getElementById('userList');
                list.innerHTML = "";
                res.data.forEach(u => {
                    if(u.Username) {
                        list.innerHTML += `
                        <li class="list-group-item d-flex justify-content-between align-items-center">
                            <div><strong>${u.Username}</strong> (${u.Role}) <br><small class="text-muted">${u.Name}</small></div>
                            <button class="btn btn-sm btn-outline-danger" onclick="deleteUser('${u.Username}')"><i class="bi bi-trash"></i></button>
                        </li>`;
                    }
                });
            }
        }

        async function addUser() {
            const u = {
                Username: document.getElementById('aUser').value,
                Password: document.getElementById('aPass').value,
                Name: document.getElementById('aName').value,
                Role: document.getElementById('aRole').value,
                Email: "-", Department: "-", Status: "Active"
            };
            if(!u.Username || !u.Password) return alert("กรอกข้อมูลให้ครบ");
            let res = await callAPI({ action: "addUser", user: u });
            if(res.status === "success") {
                document.getElementById('aUser').value = '';
                document.getElementById('aPass').value = '';
                document.getElementById('aName').value = '';
                loadUsers();
            }
        }

        async function deleteUser(username) {
            if(confirm(`ต้องการลบผู้ใช้ ${username} ใช่หรือไม่?`)) {
                let res = await callAPI({ action: "deleteUser", username: username });
                if(res.status === "success") loadUsers();
            }
        }

        async function fetchPatients() {
            let res = await callAPI({ action: "getPatients" });
            if(res.status === "success") patientsList = res.data;
        }

        // GPS ทั่วไป (ใช้งานร่วมกัน)
        function getLocation(latId, lngId) {
            navigator.geolocation.getCurrentPosition(pos => {
                document.getElementById(latId).value = pos.coords.latitude;
                document.getElementById(lngId).value = pos.coords.longitude;
            });
        }

        // ระบบแผนที่
        function initMap() {
            if(!map) {
                map = L.map('map').setView([14.02, 99.53], 10);
                L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png').addTo(map);
                setTimeout(() => { map.invalidateSize(); loadMapData(); }, 300);
            }
        }

        function loadMapData() {
            if(!map || patientsList.length === 0) return;
            map.eachLayer((layer) => { if (layer instanceof L.Marker) { map.removeLayer(layer); } });
            patientsList.forEach(p => {
                if(p.Latitude && p.Longitude) {
                    let navLink = `<br><button class='btn btn-sm btn-primary mt-2 w-100' onclick='window.open("https://www.google.com/maps/dir/?api=1&destination=${p.Latitude},${p.Longitude}")'><i class="bi bi-geo-alt-fill"></i> นำทาง</button>`;
                    L.marker([p.Latitude, p.Longitude]).addTo(map).bindPopup(`<b>${p.Name}</b><br>HN: ${p.HN}${navLink}`);
                }
            });
        }
    </script>
</body>
</html>
