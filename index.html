<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ระบบเยี่ยมบ้านผู้ป่วย</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://accounts.google.com/gsi/client" async defer></script>
</head>
<body class="bg-light">

<!-- หน้า Login -->
<div class="container mt-5" id="loginSection">
    <div class="row justify-content-center">
        <div class="col-md-5">
            <div class="card shadow-sm">
                <div class="card-body p-4">
                    <h4 class="text-center mb-4">เข้าสู่ระบบเยี่ยมบ้าน</h4>
                    
                    <!-- ส่วนที่ 1: Login ด้วย Username/Password -->
                    <form id="standardLoginForm" onsubmit="event.preventDefault(); loginWithPassword();">
                        <div class="mb-3">
                            <label class="form-label">ชื่อผู้ใช้งาน (Username)</label>
                            <input type="text" class="form-control" id="inputUsername" required>
                        </div>
                        <div class="mb-3">
                            <label class="form-label">รหัสผ่าน (Password)</label>
                            <input type="password" class="form-control" id="inputPassword" required>
                        </div>
                        <button type="submit" class="btn btn-primary w-100" id="loginBtn">เข้าสู่ระบบ</button>
                    </form>

                    <hr class="my-4">

                    <!-- ส่วนที่ 2: Login ด้วย Google -->
                    <div class="text-center">
                        <p class="text-muted mb-2">หรือเข้าสู่ระบบด้วย</p>
                        <div id="g_id_onload"
                             data-client_id="YOUR_GOOGLE_CLIENT_ID_HERE.apps.googleusercontent.com"
                             data-callback="handleGoogleLogin"
                             data-auto_prompt="false">
                        </div>
                        <div class="g_id_signin d-inline-block" data-type="standard"></div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<!-- หน้าหลักของแอปพลิเคชัน (ซ่อนไว้จนกว่าจะ Login สำเร็จ) -->
<div class="container mt-4 d-none" id="mainAppSection">
    <div class="d-flex justify-content-between align-items-center mb-3">
        <h4 id="welcomeMessage" class="text-primary">ยินดีต้อนรับ</h4>
        <button class="btn btn-outline-danger btn-sm" onclick="location.reload()">ออกจากระบบ</button>
    </div>
    
    <ul class="nav nav-tabs" id="mainTabs" role="tablist">
        <li class="nav-item" role="presentation">
            <button class="nav-link active" data-bs-toggle="tab" data-bs-target="#visit" type="button" role="tab">ลงทะเบียน & เยี่ยมบ้าน</button>
        </li>
        <li class="nav-item d-none" id="adminTabNav" role="presentation">
            <button class="nav-link" data-bs-toggle="tab" data-bs-target="#admin" type="button" role="tab">ระบบจัดการ Admin</button>
        </li>
    </ul>
    
    <div class="tab-content border border-top-0 p-3 bg-white shadow-sm rounded-bottom">
        <div class="tab-pane fade show active" id="visit" role="tabpanel">
            <h5>ส่วนที่ 1: ลงทะเบียนผู้ป่วยและดึงพิกัด</h5>
            <!-- เตรียมฟอร์มสำหรับการปักหมุดที่นี่ -->
        </div>
        <div class="tab-pane fade" id="admin" role="tabpanel">
            <h5>หน้าสำหรับผู้ดูแลระบบ</h5>
        </div>
    </div>
</div>

<script>
const GAS_WEB_APP_URL = "https://script.google.com/macros/s/AKfycbw0lF6jCCxHufuHsbuVmYEmO6n3a4QcKEphavPcdSs_68c6cWGHi8BS6SVFQN5jROjyGA/exec"; // นำ URL จาก GAS มาวางที่นี่

// ฟังก์ชัน 1: จัดการการ Login แบบ Username / Password
function loginWithPassword() {
    const user = document.getElementById('inputUsername').value;
    const pass = document.getElementById('inputPassword').value;
    const btn = document.getElementById('loginBtn');
    
    btn.innerHTML = "กำลังตรวจสอบ...";
    btn.disabled = true;

    fetch(GAS_WEB_APP_URL, {
        method: 'POST',
        body: JSON.stringify({ action: "loginStandard", username: user, password: pass }),
        headers: { 'Content-Type': 'text/plain;charset=utf-8' }
    })
    .then(res => res.json())
    .then(data => processLoginResult(data))
    .catch(err => {
        alert("เกิดข้อผิดพลาดในการเชื่อมต่อ");
        btn.innerHTML = "เข้าสู่ระบบ";
        btn.disabled = false;
    });
}

// ฟังก์ชัน 2: จัดการการ Login แบบ Google Gmail
function handleGoogleLogin(response) {
    const payload = JSON.parse(atob(response.credential.split('.')[1]));
    const userEmail = payload.email;

    fetch(GAS_WEB_APP_URL, {
        method: 'POST',
        body: JSON.stringify({ action: "loginGoogle", email: userEmail }),
        headers: { 'Content-Type': 'text/plain;charset=utf-8' }
    })
    .then(res => res.json())
    .then(data => processLoginResult(data, userEmail))
    .catch(err => alert("เกิดข้อผิดพลาดในการเชื่อมต่อกับ Google"));
}

// ฟังก์ชันใช้ร่วมกัน: จัดการหน้าจอเมื่อตรวจสอบสิทธิ์เสร็จสิ้น
function processLoginResult(data, emailInput = "") {
    if (data.status === "success") {
        // ซ่อนฟอร์ม Login และแสดง Application
        document.getElementById("loginSection").classList.add("d-none");
        document.getElementById("mainAppSection").classList.remove("d-none");
        document.getElementById("welcomeMessage").innerText = `ยินดีต้อนรับ: ${data.name} (${data.role})`;
        
        // ถ้าเป็น Admin ให้เปิดแท็บจัดการ
        if (data.role === "Admin") {
            document.getElementById("adminTabNav").classList.remove("d-none");
        }
    } else {
        alert("ข้อมูลผู้ใช้งานไม่ถูกต้อง หรือไม่มีสิทธิ์เข้าถึงระบบ");
        document.getElementById('loginBtn').innerHTML = "เข้าสู่ระบบ";
        document.getElementById('loginBtn').disabled = false;
    }
}
</script>
</body>
</html>
