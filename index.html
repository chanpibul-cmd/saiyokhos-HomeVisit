<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ระบบเยี่ยมบ้าน</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body { background-color: #f8f9fa; }
        #map { height: 400px; width: 100%; border-radius: 8px; }
        .hidden { display: none !important; }
        .nav-pills .nav-link { border-radius: 0; }
        /* ซ่อนหน้าต่างๆ ไว้ก่อน */
        #app-container { display: none; }
    </style>
</head>
<body>

    <div id="login-container" class="container mt-5">
        <div class="row justify-content-center">
            <div class="col-md-4">
                <div class="card shadow-sm">
                    <div class="card-body">
                        <h5 class="text-center mb-4">เข้าสู่ระบบ</h5>
                        <input type="text" id="username" class="form-control mb-3" placeholder="Username">
                        <input type="password" id="password" class="form-control mb-3" placeholder="Password">
                        <button class="btn btn-primary w-100" onclick="login()">เข้าสู่ระบบ</button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <div id="app-container" class="container-fluid p-0">
        <ul class="nav nav-pills nav-fill bg-white border-bottom shadow-sm" id="myTab" role="tablist">
            <li class="nav-item" role="presentation">
                <button class="nav-link active" id="patient-tab" data-bs-toggle="tab" data-bs-target="#patient" type="button" role="tab">ผู้ป่วย</button>
            </li>
            <li class="nav-item" role="presentation">
                <button class="nav-link" id="visit-tab" data-bs-toggle="tab" data-bs-target="#visit" type="button" role="tab">เยี่ยมบ้าน</button>
            </li>
            <li class="nav-item" role="presentation">
                <button class="nav-link" id="map-tab" data-bs-toggle="tab" data-bs-target="#mapView" type="button" role="tab" onclick="initMap()">แผนที่</button>
            </li>
        </ul>

        <div class="tab-content p-3" id="myTabContent">
            
            <div class="tab-pane fade show active" id="patient" role="tabpanel">
                <div class="card shadow-sm mb-3">
                    <div class="card-body">
                        <h6>ลงทะเบียนผู้ป่วยใหม่</h6>
                        <input type="text" id="pHN" class="form-control mb-2" placeholder="HN">
                        <input type="text" id="pName" class="form-control mb-2" placeholder="ชื่อ-สกุล">
                        <input type="text" id="pCID" class="form-control mb-2" placeholder="เลขบัตรประชาชน">
                        <textarea id="pAddress" class="form-control mb-2" placeholder="ที่อยู่"></textarea>
                        <input type="text" id="pPhone" class="form-control mb-2" placeholder="เบอร์โทร">
                        <input type="text" id="pDisease" class="form-control mb-2" placeholder="โรคประจำตัว">
                        <div class="input-group mb-2">
                            <input type="text" id="pLat" class="form-control" placeholder="ละติจูด (Lat)">
                            <input type="text" id="pLng" class="form-control" placeholder="ลองจิจูด (Lng)">
                            <button class="btn btn-outline-secondary" type="button" onclick="getCurrentLocationForPatient()">ปักหมุดปัจจุบัน</button>
                        </div>
                        <button class="btn btn-success w-100" onclick="savePatient()">บันทึกผู้ป่วยใหม่</button>
                    </div>
                </div>
            </div>

            <div class="tab-pane fade" id="visit" role="tabpanel">
                <div class="card shadow-sm">
                    <div class="card-body">
                        <h6>บันทึกเยี่ยมบ้าน</h6>
                        <input type="text" id="vHN" class="form-control mb-2" placeholder="HN ผู้ป่วย">
                        <input type="date" id="vDate" class="form-control mb-2">
                        <textarea id="vDetails" class="form-control mb-2" rows="3" placeholder="รายละเอียดการเยี่ยม"></textarea>
                        
                        <label class="form-label text-muted small">อัปโหลดรูป (สูงสุด 6 รูป)</label>
                        <input type="file" id="vPhotos" class="form-control mb-2" accept="image/*" multiple>
                        
                        <div class="input-group mb-3">
                            <input type="text" id="vLat" class="form-control" placeholder="Lat" readonly>
                            <input type="text" id="vLng" class="form-control" placeholder="Lng" readonly>
                            <button class="btn btn-info text-white" type="button" onclick="getVisitLocation()">เช็คพิกัด</button>
                        </div>

                        <button class="btn btn-primary w-100" onclick="saveVisit()" id="btnSaveVisit">บันทึกข้อมูลเยี่ยมบ้าน</button>
                    </div>
                </div>
            </div>

            <div class="tab-pane fade" id="mapView" role="tabpanel">
                <div id="map"></div>
                <button class="btn btn-success w-100 mt-2" onclick="loadMapData()">รีเฟรชหมุดผู้ป่วย</button>
            </div>

        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    
    <script>
        // ใช้ Web App URL ตามที่คุณกำหนด
        const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbzurrcUxFVN2UQfGAd5a7D1cOYZk-Jto-rUjwfhp45Apn9H8AksVlGAk1vQP83W6o0C4w/exec';
        let currentUserEmail = "";
        let patientsList = [];
        let map;

        // API Call Helper
        async function callAPI(payload) {
            const response = await fetch(SCRIPT_URL, {
                method: 'POST',
                body: JSON.stringify(payload)
            });
            return await response.json();
        }

        // 1. ระบบ Login
        async function login() {
            const u = document.getElementById('username').value;
            const p = document.getElementById('password').value;
            if(!u || !p) return alert("กรุณากรอกข้อมูล");
            
            let res = await callAPI({ action: "login", username: u, password: p });
            if(res.status === "success") {
                currentUserEmail = res.email;
                document.getElementById('login-container').classList.add('hidden');
                document.getElementById('app-container').style.display = 'block';
                fetchPatients(); // โหลดข้อมูลผู้ป่วยทันที
            } else {
                alert(res.message);
            }
        }

        // 2. แปลงปี พ.ศ. เป็น ค.ศ. (จัดการวันที่)
        function formatToCE(dateStr) {
            if (!dateStr) return "";
            let parts = dateStr.split("-");
            let year = parseInt(parts[0]);
            if (year > 2500) year -= 543;
            return `${year}-${parts[1]}-${parts[2]}`;
        }

        // 3. ระบบย่อรูปภาพ (ลดขนาดไฟล์ก่อนส่งประหยัดพื้นที่)
        function compressImage(file, maxSize = 800) {
            return new Promise((resolve) => {
                const reader = new FileReader();
                reader.readAsDataURL(file);
                reader.onload = event => {
                    const img = new Image();
                    img.src = event.target.result;
                    img.onload = () => {
                        const canvas = document.createElement('canvas');
                        let width = img.width;
                        let height = img.height;

                        if (width > height) {
                            if (width > maxSize) { height *= maxSize / width; width = maxSize; }
                        } else {
                            if (height > maxSize) { width *= maxSize / height; height = maxSize; }
                        }
                        canvas.width = width;
                        canvas.height = height;
                        const ctx = canvas.getContext('2d');
                        ctx.drawImage(img, 0, 0, width, height);
                        resolve(canvas.toDataURL('image/jpeg', 0.6)); // ย่อคุณภาพ 60%
                    };
                };
            });
        }

        // 4. บันทึกเยี่ยมบ้าน
        async function saveVisit() {
            const hn = document.getElementById('vHN').value;
            const dateInput = document.getElementById('vDate').value;
            const details = document.getElementById('vDetails').value;
            const lat = document.getElementById('vLat').value;
            const lng = document.getElementById('vLng').value;
            const fileInput = document.getElementById('vPhotos');

            if(!hn || !dateInput) return alert("กรุณาระบุ HN และ วันที่");
            if(fileInput.files.length > 6) return alert("อัปโหลดได้สูงสุด 6 รูปเท่านั้น");

            document.getElementById('btnSaveVisit').innerText = "กำลังบันทึก...";
            document.getElementById('btnSaveVisit').disabled = true;

            const finalDate = formatToCE(dateInput); // ตรวจสอบและแปลงปี
            const visitId = "V" + new Date().getTime().toString().slice(-6); // Gen ID แบบสั้น
            
            let base64Photos = [];
            for (let i = 0; i < fileInput.files.length; i++) {
                let base64Str = await compressImage(fileInput.files[i]);
                base64Photos.push(base64Str);
            }

            const payload = {
                action: "saveVisit",
                visit: {
                    Visit_ID: visitId, HN: hn, Visit_Date: finalDate, 
                    Staff_Email: currentUserEmail, Details: details, 
                    Lat_Logged: lat, Lng_Logged: lng, photos: base64Photos
                }
            };

            let res = await callAPI(payload);
            if(res.status === "success") {
                alert("บันทึกข้อมูลและอัปโหลดรูปสำเร็จ!");
                document.getElementById('vHN').value = "";
                document.getElementById('vDetails').value = "";
                fileInput.value = "";
            } else {
                alert("เกิดข้อผิดพลาด");
            }
            document.getElementById('btnSaveVisit').innerText = "บันทึกข้อมูลเยี่ยมบ้าน";
            document.getElementById('btnSaveVisit').disabled = false;
        }

        // 5. บันทึกผู้ป่วยใหม่
        async function savePatient() {
            const p = {
                HN: document.getElementById('pHN').value,
                Name: document.getElementById('pName').value,
                CID: document.getElementById('pCID').value,
                Address: document.getElementById('pAddress').value,
                Phone: document.getElementById('pPhone').value,
                Chronic_Disease: document.getElementById('pDisease').value,
                Latitude: document.getElementById('pLat').value,
                Longitude: document.getElementById('pLng').value
            };
            if(!p.HN || !p.Name) return alert("กรุณาระบุ HN และ ชื่อ");
            
            let res = await callAPI({ action: "savePatient", patient: p });
            if(res.status === "success") {
                alert("บันทึกผู้ป่วยใหม่สำเร็จ");
                fetchPatients(); // โหลดข้อมูลใหม่
            }
        }

        // 6. ดึงข้อมูลผู้ป่วย
        async function fetchPatients() {
            let res = await callAPI({ action: "getPatients" });
            if(res.status === "success") {
                patientsList = res.data;
            }
        }

        // 7. พิกัด GPS สำหรับฟอร์ม
        function getCurrentLocationForPatient() {
            navigator.geolocation.getCurrentPosition(pos => {
                document.getElementById('pLat').value = pos.coords.latitude;
                document.getElementById('pLng').value = pos.coords.longitude;
            });
        }

        function getVisitLocation() {
            navigator.geolocation.getCurrentPosition(pos => {
                document.getElementById('vLat').value = pos.coords.latitude;
                document.getElementById('vLng').value = pos.coords.longitude;
            });
        }

        // 8. ระบบแผนที่ (Leaflet) + นำทางไป Google Maps
        function initMap() {
            if(!map) {
                // เซ็ตค่าเริ่มต้นแผนที่
                map = L.map('map').setView([14.02, 99.53], 10);
                L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
                    maxZoom: 19
                }).addTo(map);
                loadMapData();
            }
        }

        function loadMapData() {
            if(!map || patientsList.length === 0) return;
            
            // ลบหมุดเก่า
            map.eachLayer((layer) => {
                if (layer instanceof L.Marker) { map.removeLayer(layer); }
            });

            patientsList.forEach(p => {
                if(p.Latitude && p.Longitude) {
                    // ปุ่มเปิด Google Maps นำทาง
                    let navLink = `<br><button class='btn btn-sm btn-primary mt-2' onclick='window.open("https://www.google.com/maps/dir/?api=1&destination=${p.Latitude},${p.Longitude}")'>นำทางด้วย Google Maps</button>`;
                    
                    L.marker([p.Latitude, p.Longitude])
                     .addTo(map)
                     .bindPopup(`<b>${p.Name}</b><br>HN: ${p.HN}<br>ที่อยู่: ${p.Address}${navLink}`);
                }
            });
        }
    </script>
</body>
</html>
